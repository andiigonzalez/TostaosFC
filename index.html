<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>Tostaos F.C.</title>
<meta name="description" content="Plantilla, crónicas y calendario de Tostaos F.C.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="escudo.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <div class="wrap top__inner">
    <a class="brand" href="#inicio" aria-label="Tostaos F.C., inicio">
      <img src="escudo.svg" width="104" height="68" alt="">
      <span class="brand__text">
        <span class="brand__name">TOSTAOS F.C.</span>
        <span class="brand__sub" id="brand-sub"></span>
      </span>
    </a>
      <nav class="tabs" aria-label="Secciones">
      <a href="#inicio" data-tab="inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
      <a href="#plantilla" data-tab="plantilla"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg><span>Plantilla</span></a>
      <a href="#partidos" data-tab="partidos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5L7 18.5M8 10L3.5 8.5"/></svg><span>Partidos</span></a>
      <a href="#calendario" data-tab="calendario"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></a>
    </nav>
    </nav>
  </div>
</header>

<main class="wrap main">
  <div id="aviso" class="aviso" hidden></div>
  <section id="view-inicio" class="view" data-view="inicio"></section>
  <section id="view-plantilla" class="view" data-view="plantilla" hidden></section>
  <section id="view-partidos" class="view" data-view="partidos" hidden></section>
  <section id="view-calendario" class="view" data-view="calendario" hidden></section>
</main>

<footer class="foot">
  <div class="wrap foot__inner">
    <span id="foot-left">Tostaos F.C.</span>
    <span>Actualizado cada semana tras el partido</span>
  </div>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
